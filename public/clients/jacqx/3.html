<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jacqx Website Preview</title>
    <style>
        /* Reset defaults to ensure true full-screen width */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0b0b0b; /* Dark background for a sleek premium feel */
            width: 100%;
            overflow-x: hidden; /* Prevents awkward horizontal scrolling */
        }

        .screenshot-container {
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        .screenshot-img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <div class="screenshot-container">
        <img src="jacqx3.jpeg" alt="Website Homepage Screenshot" class="screenshot-img">
    </div>

</body>
</html>
